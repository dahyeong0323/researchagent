name: Research Agent Daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  research-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run daily:dry
        env:
          RESEARCH_AGENT_FEEDS_PATH: data/research-agent/feeds.sample.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-agent-runs
          path: data/research-agent/runs/*.json
          if-no-files-found: ignore
